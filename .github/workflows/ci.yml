name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same branch has nothing to tell us, so let a newer
# push cancel it. Deployments are the opposite case and must never be cancelled;
# see docker.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the toolchain follows the go directive
          # instead of a version pinned in two places that can drift.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          # api/docs is generated by swag and is not gofmt-clean.
          unformatted="$(gofmt -l . | grep -v '^api/docs/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race is the point of this step: the app runs concurrent SSE drains,
      # health checks and rate limiting, and a data race in any of them is
      # invisible without it.
      - name: test
        run: go test -race -count=1 ./...

      - name: verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit"
            git diff go.mod go.sum
            exit 1
          fi

  # Catches a broken Dockerfile on a pull request, without pushing anything.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
