# Local development stack: Postgres, Redis and the API.
#
#   cp .env.example .env      # then set JWT_SECRET
#   docker compose up --build
#
# The API waits for both dependencies to report healthy, so the first start does
# not race the database.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
    # Same image as the API; only the entrypoint differs, so migrations always
    # run against the exact code being deployed.
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-production}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      # HOST comes from the image as 0.0.0.0; localhost would be unreachable.
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-production}
      DOCS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Must exceed SHUTDOWN_TIMEOUT (10s default) or Docker sends SIGKILL while
    # the app is still draining. The default here is 10s, which is exactly the
    # budget and therefore too tight.
    stop_grace_period: 20s

volumes:
  postgres-data:
